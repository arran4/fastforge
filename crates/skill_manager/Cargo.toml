[package]
name = "fastforge_skill_manager"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Skill management for Fastforge"
license.workspace = true

[dependencies]
fastforge_core = { path = "../core" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.0", features = ["fs", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = "0.4"
sha2 = "0.10"
hex = "0.4"

regex = "1.10"
walkdir = "2.5"
log = "0.4"
clap = { version = "4.5", features = ["derive"] }
uuid = { version = "1.8", features = ["v4"] }
dirs = "5.0"
flate2 = "1.0"
tar = "0.4.46"
[dev-dependencies]
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
